[package]
name = "storage"
version = "0.1.0"
edition = "2024"

[dependencies]
scene = { version = "0.1.0", path = "../scene" }
transfer = { version = "0.1.0", path = "../transfer" }
serde = { version = "1.0", features = ["derive"] }
